name: Compile OpenClash IPK Only

on: 
  push:
    branches:
      - dev
      - master
    paths:
      - 'luci-app-openclash/Makefile'
  workflow_dispatch:

jobs:
  Get-Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      current_version: ${{ steps.current_version.outputs.version }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: New Version
        id: version
        run: |
          NEW_VER=$(grep 'PKG_VERSION:=' ./luci-app-openclash/Makefile | awk -F '=' '{print $2}')
          echo "version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "New Version: $NEW_VER"

      - name: Clone Repository (Package)
        uses: actions/checkout@v4
        with:
          ref: package

      - name: Current Version
        id: current_version
        run: |
          BRANCH_DIR=./${{ github.ref_name }}
          mkdir -p "$BRANCH_DIR"
          VERSION_FILE="$BRANCH_DIR/version"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "0" > "$VERSION_FILE"
          fi
          CUR_VER=$(sed -n 1p $VERSION_FILE | awk -F 'v' '{print $2}')
          echo "version=$CUR_VER" >> $GITHUB_OUTPUT
          echo "Current Version: $CUR_VER"

  Compile:
    runs-on: ubuntu-latest
    needs: Get-Version
    if: ${{ needs.Get-Version.outputs.version != needs.Get-Version.outputs.current_version }}
    steps:
      - name: Clone OpenClash Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apt Update
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install curl git tar bzip2 build-essential

      - name: Install OpenWrt SDK (ar71xx)
        run: |
          cd ..
          mkdir -p tmp
          curl -SLk --connect-timeout 30 --retry 2 "https://archive.openwrt.org/chaos_calmer/15.05.1/ar71xx/generic/OpenWrt-SDK-15.05.1-ar71xx-generic_gcc-4.8-linaro_uClibc-0.9.33.2.Linux-x86_64.tar.bz2" -o "./tmp/SDK.tar.bz2"
          cd tmp
          tar xjf SDK.tar.bz2
          mv "OpenWrt-SDK-15.05.1-ar71xx-generic_gcc-4.8-linaro_uClibc-0.9.33.2.Linux-x86_64" "SDK"

      - name: Copy OpenClash Source
        run: |
          cd ..
          mkdir -p tmp/SDK/package/luci-app-openclash
          cp -rf "./OpenClash/luci-app-openclash/." "./tmp/SDK/package/luci-app-openclash/"

      - name: Compile po2lmo
        run: |
          cd ..
          cd tmp/SDK/package/
          pushd luci-app-openclash/tools/po2lmo
          make && sudo make install
          popd

      - name: Compile OpenClash IPK
        run: |
          cd ..
          cd tmp/SDK
          make package/luci-app-openclash/compile V=99

      - name: Commit and Push New Version
        run: |
          BRANCH_DIR=./${{ github.ref_name }}
          mkdir -p "$BRANCH_DIR"
          rm -rf $BRANCH_DIR/luci-app-openclash*
          echo "v${{ needs.Get-Version.outputs.version }}" > $BRANCH_DIR/version
          echo "https://img.shields.io/badge/New Release-v${{ needs.Get-Version.outputs.version }}-orange.svg" >> $BRANCH_DIR/version

          # Buat README.md jika belum ada
          README="$BRANCH_DIR/README.md"
          if [ ! -f "$README" ]; then
            touch "$README"
          fi

          cd ..
          cp "./tmp/SDK/bin/ar71xx/packages/base/luci-app-openclash_${{ needs.Get-Version.outputs.version }}_all.ipk" "./OpenClash/${{ github.ref_name }}/luci-app-openclash_${{ needs.Get-Version.outputs.version }}_all.ipk"

          # Update badge & link di README.md
          sed -i -E "s/OpenClash\/tree\/v(.*)/OpenClash\/tree\/v${{ needs.Get-Version.outputs.version }}/g" $README
          sed -i -E "s/OpenClash\/releases\/tag\/v(.*)/OpenClash\/releases\/tag\/v${{ needs.Get-Version.outputs.version }}/g" $README
          sed -i -E "s/source code-v(.*)-green/source code-v${{ needs.Get-Version.outputs.version }}-green/g" $README
          sed -i -E "s/New Release-v(.*)-orange/New Release-v${{ needs.Get-Version.outputs.version }}-orange/g" $README

          cd OpenClash
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto Release: v${{ needs.Get-Version.outputs.version }}"
          git push

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ needs.Get-Version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload IPK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ needs.Get-Version.outputs.version }}"
          name: luci-app-openclash-${{ needs.Get-Version.outputs.version }}-all.ipk
          asset_path: ./tmp/SDK/bin/ar71xx/packages/base/luci-app-openclash_${{ needs.Get-Version.outputs.version }}_all.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
