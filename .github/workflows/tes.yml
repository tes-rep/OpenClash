name: Build & Release OpenClash

on:
  push:
    branches:
      - dev
    paths:
      - 'luci-app-openclash/Makefile'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Get version from Makefile
      - name: Get OpenClash version
        id: get_version
        run: |
          VERSION=$(grep '^PKG_VERSION:=' ./luci-app-openclash/Makefile | awk -F':=' '{print $2}' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version found: $VERSION"

      # 3. Install dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git tar bzip2 zstd build-essential

      # 4. Download OpenWrt SDK
      - name: Download OpenWrt SDK
        run: |
          mkdir -p tmp
          curl -SL "https://downloads.openwrt.org/releases/24.10.1/targets/ar71xx/generic/openwrt-sdk-24.10.1-ar71xx-generic_gcc-12.3.0_musl.Linux-x86_64.tar.xz" -o tmp/sdk.tar.xz
          cd tmp && tar xf sdk.tar.xz

      # 5. Copy OpenClash package
      - name: Copy OpenClash package to SDK
        run: |
          SDK_DIR=$(ls tmp | grep sdk)
          mkdir -p tmp/$SDK_DIR/package/luci-app-openclash
          cp -r ./luci-app-openclash/* tmp/$SDK_DIR/package/luci-app-openclash/

      # 6. Build po2lmo
      - name: Build po2lmo
        run: |
          SDK_DIR=$(ls tmp | grep sdk)
          pushd tmp/$SDK_DIR/package/luci-app-openclash/tools/po2lmo
          make && sudo make install
          popd

      # 7. Compile IPK
      - name: Compile OpenClash IPK
        run: |
          SDK_DIR=$(ls tmp | grep sdk)
          cd tmp/$SDK_DIR
          make package/luci-app-openclash/compile V=99
          echo "IPK_FILE=$(pwd)/bin/ar71xx/packages/base/luci-app-openclash_${VERSION}_all.ipk" >> $GITHUB_ENV

      # 8. Create GitHub Release & Upload IPK
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: OpenClash v${{ env.VERSION }}
          files: ${{ env.IPK_FILE }}
          draft: false
          prerelease: false
