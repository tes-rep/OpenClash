name: Compile The New Version OpenClash

on: 
  push:
    branches:
      - dev
    paths:
      - 'luci-app-openclash/Makefile'
  workflow_dispatch:

jobs:
  Get-Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      current_version: ${{ steps.current_version.outputs.version }}
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Get New Version
        id: version
        run: |
          new_ver=$(grep 'PKG_VERSION:=' ./luci-app-openclash/Makefile | awk -F '=' '{print $2}')
          echo "version=$new_ver" >> $GITHUB_OUTPUT
          echo "New Version: $new_ver"

      - name: Checkout package branch
        uses: actions/checkout@v4
        with:
          ref: package

      - name: Get Current Version
        id: current_version
        run: |
          curr_ver=$(sed -n 1p ./${{ github.ref_name }}/version | awk -F 'v' '{print $2}')
          echo "version=$curr_ver" >> $GITHUB_OUTPUT
          echo "Current Version: $curr_ver"

  Compile:
    runs-on: ubuntu-latest
    needs: Get-Version
    if: ${{ needs.Get-Version.outputs.version != needs.Get-Version.outputs.current_version }}
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install curl git tar zstd make gcc g++

      - name: Install OpenWrt SDK
        run: |
          cd ..
          mkdir -p tmp
          curl -SLk --connect-timeout 30 --retry 2 \
            "https://archive.openwrt.org/chaos_calmer/15.05.1/ar71xx/generic/OpenWrt-SDK-15.05.1-ar71xx-generic_gcc-4.8-linaro_uClibc-0.9.33.2.Linux-x86_64.tar.bz2" \
            -o "./tmp/SDK.tar.bz2"
          cd tmp
          tar xjf SDK.tar.bz2
          mv OpenWrt-SDK-* SDK

      - name: Install OpenWrt SNAPSHOT SDK
        run: |
          cd ..
          mkdir -p tmp
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/"
          SDK_NAME=$(curl -s $BASE_URL | grep -oE 'openwrt-sdk-x86-64[^"]+\.tar\.zst' | head -n 1)
          curl -SLk --connect-timeout 30 --retry 2 "$BASE_URL/$SDK_NAME" -o "./tmp/SNAPSDK.tar.zst"
          cd tmp
          zstd -d SNAPSDK.tar.zst
          tar xf SNAPSDK.tar
          mv openwrt-sdk-* SNAPSDK

      - name: Copy OpenClash sources
        run: |
          cd ..
          mkdir -p tmp/SDK/package/luci-app-openclash
          mkdir -p tmp/SNAPSDK/package/luci-app-openclash
          cp -rf ./OpenClash/luci-app-openclash/. ./tmp/SDK/package/luci-app-openclash/
          cp -rf ./OpenClash/luci-app-openclash/. ./tmp/SNAPSDK/package/luci-app-openclash/

      - name: Compile po2lmo (from SDK only)
        run: |
          cd ../tmp/SDK/package/luci-app-openclash/tools/po2lmo
          make && sudo make install

      - name: Compile OpenClash IPK and copy to workspace
        run: |
          cd ../tmp/SDK
          make package/luci-app-openclash/compile V=s
          mkdir -p $GITHUB_WORKSPACE/openclash-sdk-ipk
          cp bin/ar71xx/packages/base/luci-app-openclash*.ipk $GITHUB_WORKSPACE/openclash-sdk-ipk/

      - name: Compile OpenClash IPK SNAPSHOT and copy to workspace
        run: |
          cd ../tmp/SNAPSDK
          make defconfig
          make package/luci-app-openclash/compile V=s
          mkdir -p $GITHUB_WORKSPACE/openclash-snap-ipk
          cp bin/packages/x86_64/base/luci-app-openclash*.ipk $GITHUB_WORKSPACE/openclash-snap-ipk/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openclash-build
          path: |
            openclash-sdk-ipk/luci-app-openclash*.ipk
            openclash-snap-ipk/luci-app-openclash*.ipk

  Push-Package:
    runs-on: ubuntu-latest
    needs: Compile
    steps:
      - name: Checkout package branch
        uses: actions/checkout@v4
        with:
          ref: package

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openclash-build
          path: ./build

      - name: Update package branch
        run: |
          rm -rf ./${{ github.ref_name }}/luci-app-openclash*
          echo "v${{ needs.Get-Version.outputs.version }}" > ./${{ github.ref_name }}/version
          echo "https://img.shields.io/badge/New Release-v${{ needs.Get-Version.outputs.version }}-orange.svg" >> ./${{ github.ref_name }}/version
          cp ./build/* ./${{ github.ref_name }}/
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto Release: v${{ needs.Get-Version.outputs.version }}"
          git push

  Release:
    runs-on: ubuntu-latest
    needs: Compile
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openclash-build
          path: ./build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.Get-Version.outputs.version }}
          name: "OpenClash v${{ needs.Get-Version.outputs.version }}"
          body: "Automatic release of OpenClash v${{ needs.Get-Version.outputs.version }}"
          files: ./build/*
