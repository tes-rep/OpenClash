name: Compile The New Version OpenClash

on: 
  push:
    branches:
      - dev
    paths:
      - 'luci-app-openclash/Makefile'
  workflow_dispatch:

jobs:
  Get-Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      current_version: ${{ steps.current_version.outputs.version }}
    steps:
      - name: Clone Repository (dev)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: New Version
        id: version
        run: |
          ver=$(grep 'PKG_VERSION:=' ./luci-app-openclash/Makefile | awk -F '=' '{print $2}')
          echo "version=$ver" >> $GITHUB_OUTPUT
          echo "New Version: $ver"

      - name: Clone Repository (package)
        uses: actions/checkout@v4
        with:
          ref: package

      - name: Current Version
        id: current_version
        run: |
          ver=$(sed -n 1p ./package/version | awk -F 'v' '{print $2}')
          echo "version=$ver" >> $GITHUB_OUTPUT
          echo "Current Version: $ver"

  Compile:
    runs-on: ubuntu-latest
    needs: Get-Version
    if: ${{ needs.Get-Version.outputs.version != needs.Get-Version.outputs.current_version }}
    steps:
      - name: Clone OpenClash dev Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apt Update
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install curl git tar zstd jq

      - name: Setup workspace folders
        run: |
          mkdir -p $GITHUB_WORKSPACE/tmp

      - name: Install OpenWrt SDK
        run: |
          curl -SLk --connect-timeout 30 --retry 2 "https://archive.openwrt.org/chaos_calmer/15.05.1/ar71xx/generic/OpenWrt-SDK-15.05.1-ar71xx-generic_gcc-4.8-linaro_uClibc-0.9.33.2.Linux-x86_64.tar.bz2" -o "$GITHUB_WORKSPACE/tmp/SDK.tar.bz2"
          cd $GITHUB_WORKSPACE/tmp
          tar xjf SDK.tar.bz2
          mv OpenWrt-SDK-15.05.1-ar71xx-generic_gcc-4.8-linaro_uClibc-0.9.33.2.Linux-x86_64 SDK

      - name: Install OpenWrt SNAPSHOT SDK
        run: |
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/"
          SDK_NAME=$(curl -s $BASE_URL | grep -oE 'openwrt-sdk-x86-64[^"]+\.tar\.zst' | head -n 1)
          curl -SLk --connect-timeout 30 --retry 2 "$BASE_URL/$SDK_NAME" -o "$GITHUB_WORKSPACE/tmp/SNAPSDK.tar.zst"
          cd $GITHUB_WORKSPACE/tmp
          zstd -d SNAPSDK.tar.zst
          tar xf SNAPSDK.tar
          SDK_DIR=$(tar tf SNAPSDK.tar | head -n 1 | cut -d/ -f1)
          mv "$SDK_DIR" SNAPSDK

      - name: Copy OpenClash Source Codes
        run: |
          cp -rf "$GITHUB_WORKSPACE/OpenClash/luci-app-openclash/." "$GITHUB_WORKSPACE/tmp/SDK/package/luci-app-openclash/"
          cp -rf "$GITHUB_WORKSPACE/OpenClash/luci-app-openclash/." "$GITHUB_WORKSPACE/tmp/SNAPSDK/package/luci-app-openclash/"

      - name: Compile po2lmo
        run: |
          cd $GITHUB_WORKSPACE/tmp/SDK/package/luci-app-openclash/tools/po2lmo
          make && sudo make install
          cd $GITHUB_WORKSPACE/tmp/SNAPSDK/package/luci-app-openclash/tools/po2lmo
          make && sudo make install

      - name: Compile OpenClash IPK
        run: |
          cd $GITHUB_WORKSPACE/tmp/SDK
          make package/luci-app-openclash/compile V=99

      - name: Compile OpenClash APK
        run: |
          cd $GITHUB_WORKSPACE/tmp/SNAPSDK
          make defconfig
          make package/luci-app-openclash/compile V=99

      - name: Switch OpenClash Repository to Package
        uses: actions/checkout@v4
        with:
          ref: package

      - name: Commit and Push New Version
        run: |
          rm -rf ./package/luci-app-openclash*
          echo "v${{ needs.Get-Version.outputs.version }}" > ./package/version
          echo "https://img.shields.io/badge/New Release-v${{ needs.Get-Version.outputs.version }}-orange.svg" >> ./package/version

          cp "$GITHUB_WORKSPACE/tmp/SDK/bin/ar71xx/packages/base/luci-app-openclash_${{ needs.Get-Version.outputs.version }}_all.ipk" "./package/luci-app-openclash_${{ needs.Get-Version.outputs.version }}_all.ipk"
          cp "$GITHUB_WORKSPACE/tmp/SNAPSDK/bin/packages/x86_64/base/luci-app-openclash-${{ needs.Get-Version.outputs.version }}.apk" "./package/luci-app-openclash-${{ needs.Get-Version.outputs.version }}.apk"

          sed -i -E "s/OpenClash\/tree\/v(.*)/OpenClash\/tree\/v${{ needs.Get-Version.outputs.version }}/g" ./package/README.md
          sed -i -E "s/OpenClash\/releases\/tag\/v(.*)/OpenClash\/releases\/tag\/v${{ needs.Get-Version.outputs.version }}/g" ./package/README.md
          sed -i -E "s/source code-v(.*)-green/source code-v${{ needs.Get-Version.outputs.version }}-green/g" ./package/README.md
          sed -i -E "s/New Release-v(.*)-orange/New Release-v${{ needs.Get-Version.outputs.version }}-orange/g" ./package/README.md

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto Release: v${{ needs.Get-Version.outputs.version }}"
          git push

  Release-and-Upload:
    needs: Compile
    runs-on: ubuntu-latest
    if: ${{ needs.Get-Version.outputs.version != needs.Get-Version.outputs.current_version }}
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Create Release if not exists
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TAG="v${{ needs.Get-Version.outputs.version }}"
          REPO="${{ github.repository }}"
          echo "Check if release $TAG exists..."

          # Cek apakah release sudah ada
          RELEASE_RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "Release not found, creating new release..."
            CREATE_RESPONSE=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Auto generated release for version $TAG\",\"draft\":false,\"prerelease\":false}" \
              "https://api.github.com/repos/$REPO/releases")

            RELEASE_ID=$(echo "$CREATE_RESPONSE" | jq -r '.id')

            if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
              echo "Failed to create release"
              exit 1
            fi
          else
            echo "Release already exists with ID $RELEASE_ID"
          fi

          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Upload IPK Asset
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          RELEASE_ID=${{ steps.create_release.outputs.release_id }}
          ASSET_PATH="$GITHUB_WORKSPACE/tmp/SDK/bin/ar71xx/packages/base/luci-app-openclash_${{ needs.Get-Version.outputs.version }}_all.ipk"
          FILE_NAME=$(basename "$ASSET_PATH")

          echo "Uploading $FILE_NAME to release ID $RELEASE_ID..."
          curl --fail -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$ASSET_PATH" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$FILE_NAME"

      - name: Upload APK Asset
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          RELEASE_ID=${{ steps.create_release.outputs.release_id }}
          ASSET_PATH="$GITHUB_WORKSPACE/tmp/SNAPSDK/bin/packages/x86_64/base/luci-app-openclash-${{ needs.Get-Version.outputs.version }}.apk"
          FILE_NAME=$(basename "$ASSET_PATH")

          echo "Uploading $FILE_NAME to release ID $RELEASE_ID..."
          curl --fail -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$ASSET_PATH" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$FILE_NAME"
