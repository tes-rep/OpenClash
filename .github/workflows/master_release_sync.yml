name: Sync Dev to Master & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  sync_core:
    name: Sync Core Dev → Master
    runs-on: ubuntu-latest
    steps:
      - name: Install Git
        run: sudo apt-get update && sudo apt-get -y install git

      - name: Clone core master
        run: git clone --branch master --single-branch https://github.com/<user>/<repo>.git core-master

      - name: Clone core dev
        run: git clone --branch dev --single-branch https://github.com/<user>/<repo>.git core-dev

      - name: Sync dev → master
        run: |
          if [ -n "$(diff -r ./core-master ./core-dev)" ]; then
            cp -rf ./core-dev/* ./core-master/
            cd core-master
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m "Sync core dev to master from tag $GITHUB_REF_NAME"
            git push origin master
          else
            echo "Core master already up-to-date."
          fi

  sync_package:
    name: Sync Package Dev → Master
    runs-on: ubuntu-latest
    steps:
      - name: Install Git
        run: sudo apt-get update && sudo apt-get -y install git

      - name: Clone package master
        run: git clone --branch master --single-branch https://github.com/tes-rep/OpenClash.git pkg-master

      - name: Clone package dev
        run: git clone --branch dev --single-branch https://github.com/tes-rep/OpenClash.git pkg-dev

      - name: Sync dev → master
        run: |
          if [ -n "$(diff -r ./pkg-master ./pkg-dev)" ]; then
            cp -rf ./pkg-dev/* ./pkg-master/
            cd pkg-master
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m "Sync package dev to master from tag $GITHUB_REF_NAME"
            git push origin master
          else
            echo "Package master already up-to-date."
          fi

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [sync_core, sync_package]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automatic release after syncing core and package from dev to master.
