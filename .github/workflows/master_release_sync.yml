name: Sync Core and Package to Master + Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  sync_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Apt Update
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install git

      ######################
      # 1. Sync Core Branch
      ######################
      - name: Checkout core branch
        uses: actions/checkout@v4
        with:
          ref: core
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync dev core to master
        run: |
          git fetch origin master:master
          if [ -n "$(diff -r ./master/ ./dev/)" ]; then
            rm -rf ./master/premium
            rm -rf ./master/dev
            rm -rf ./master/meta/*
            rm -rf ./master/smart/*
            rm -rf ./master/core_version
            cp -rf "./dev/." "./master/"
            cd master
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m "Release: Auto sync dev core" || echo "No changes to commit"
            git push origin master
          else
            echo "master core already sync to dev, exit"
          fi

      ######################
      # 2. Sync Package Branch
      ######################
      - name: Checkout package branch
        uses: actions/checkout@v4
        with:
          ref: package
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync dev package to master
        run: |
          git fetch origin master:master
          if [ -n "$(diff -r ./master/ ./dev/)" ]; then
            rm -rf ./master/README.md
            rm -rf ./master/luci-app-openclash*
            rm -rf ./master/version
            cp -rf "./dev/." "./master/"
            cd master
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m "Release: Auto sync dev package" || echo "No changes to commit"
            git push origin master
          else
            echo "master package already sync to dev, exit"
          fi

      ######################
      # 3. Auto Create Release
      ######################
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            🚀 **Release ${{ github.ref_name }}**
            - Sinkronisasi branch dev → master
            - Core dan Package terbaru
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
