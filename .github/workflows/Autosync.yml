name: Sync OpenClash Dev (Rebase)

on:
  schedule:
    - cron: '*/30 * * * *' # cek setiap 30 menit
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure dev branch exists
        run: |
          git fetch origin dev || true
          if git ls-remote --exit-code origin dev >/dev/null 2>&1; then
            git checkout dev || git checkout -b dev origin/dev
          else
            git checkout -b dev
            git push origin dev
          fi

      - name: Setup upstream remote
        run: |
          git remote set-url upstream https://github.com/vernesong/OpenClash.git || \
          git remote add upstream https://github.com/vernesong/OpenClash.git
          git fetch upstream dev

      - name: Rebase dev onto upstream/dev
        run: |
          git checkout dev
          git rebase upstream/dev || git rebase --abort

      - name: Force push to origin
        run: |
          git push origin dev --force
