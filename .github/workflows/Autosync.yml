name: Sync OpenClash Dev (Rebase)

on:
  schedule:
    - cron: '*/30 * * * *' # cek setiap 30 menit
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure dev branch exists
        run: |
          git fetch origin
          if ! git show-ref --verify --quiet refs/heads/dev; then
            git checkout -b mod origin/dev || git checkout -b mod
            git push origin mod
          else
            git checkout mod
          fi

      - name: Setup upstream remote
        run: |
          git remote set-url upstream https://github.com/vernesong/OpenClash.git || \
          git remote add upstream https://github.com/vernesong/OpenClash.git
          git fetch upstream

      - name: Rebase dev onto upstream/dev
        run: |
          git checkout mod
          git rebase upstream/dev || git rebase --abort

      - name: Force push to origin
        run: |
          git push origin mod --force
