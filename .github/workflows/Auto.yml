name: Sync OpenClash Dev (Rebase)

on:
  schedule:
    - cron: '*/30 * * * *' # cek setiap 10 menit
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/vernesong/OpenClash.git
          git fetch upstream

      - name: Rebase dev onto upstream/dev
        run: |
          git checkout dev
          git rebase upstream/dev

      - name: Force push to origin
        run: |
          git push origin dev --force
